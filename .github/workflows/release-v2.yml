name: Notebook 2.0 builds
on:
  workflow_dispatch:
  push:
    tags: ['v2.*']
jobs:
  pc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, goos: windows, goarch: amd64, electron: x64}
          - {os: macos-latest, goos: darwin, goarch: arm64, electron: arm64}
          - {os: macos-15-intel, goos: darwin, goarch: amd64, electron: x64}
          - {os: ubuntu-latest, goos: linux, goarch: amd64}
          - {os: ubuntu-latest, goos: linux, goarch: arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: go test ./...
        working-directory: backend
      - run: node scripts/build.mjs
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: Native server lifecycle smoke
        if: matrix.goos == 'windows' || matrix.goos == 'linux' && matrix.goarch == 'amd64' || matrix.goos == 'darwin'
        run: python scripts/smoke.py dist/notebook-2.0.0-${{ matrix.goos }}-${{ matrix.goarch }}/notebook-server${{ matrix.goos == 'windows' && '.exe' || '' }}
      - if: matrix.goos != 'linux'
        run: npm ci
        working-directory: desktop
      - if: matrix.goos != 'linux'
        run: npx electron-builder --${{ matrix.goos == 'windows' && 'win' || 'mac' }} --${{ matrix.electron }}
        working-directory: desktop
        env:
          NOTEBOOK_RELEASE_KIND: ${{ (matrix.goos == 'windows' && secrets.WIN_CSC_LINK != '' || matrix.goos == 'darwin' && secrets.MAC_CSC_LINK != '') && 'signed' || 'unsigned-test' }}
          CSC_LINK: ${{ matrix.goos == 'windows' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.goos == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - if: matrix.goos == 'linux'
        run: tar -czf dist/notebook-2.0.0-linux-${{ matrix.goarch }}.tar.gz -C dist notebook-2.0.0-linux-${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.zip
            dist/*.tar.gz
            dist/notebook-*/notebook-server*
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: printf '{"flavor":"production","apiBaseUrl":""}\n' > mobile/flutter_app/config/app_config.json
      - run: flutter pub get
        working-directory: mobile/flutter_app
      - run: flutter analyze --no-fatal-infos && flutter test
        working-directory: mobile/flutter_app
      - name: Configure optional release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > mobile/flutter_app/android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > mobile/flutter_app/android/key.properties
          fi
      - run: flutter build apk --release --dart-define=APP_FLAVOR=production
        working-directory: mobile/flutter_app
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-android-${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'signed' || 'test-debug-signed' }}
          path: mobile/flutter_app/build/app/outputs/flutter-apk/app-release.apk
